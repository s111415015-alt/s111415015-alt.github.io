<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人名片</title>
  <style>
    body {
      background: #f5f6fa;
      font-family: 'Segoe UI', '微軟正黑體', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      display: flex;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      width: 480px;
      max-width: 95vw;
      min-height: 220px;
    }
    .card-left {
      background: linear-gradient(135deg, #4c6bbe 60%, #1e1242 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      min-width: 140px;
      padding: 24px 0;
    }
    .avatar {
      width: 140px;
      height: 140px;
      clip-path: polygon(
        50% 0%,
        85.1% 15.5%,
        100% 50%,
        85.1% 84.5%,
        50% 100%,
        14.9% 84.5%,
        0% 50%,
        14.9% 15.5%,
        29.4% 4.9%,
        70.6% 4.9%,
        85.1% 15.5%
      );
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      background: #fff;
    }
    .card-right {
      flex: 1;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .name {
      font-size: 1.6em;
      font-weight: bold;
      color: #170bbb;
      margin-bottom: 8px;
    }
    .title {
      font-size: 1.1em;
      color: #555;
      margin-bottom: 16px;
    }
    .info {
      font-size: 1em;
      color: #888;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-left">
      <img class="avatar" src="pic1014.JPG" alt="個人照片">
    </div>
    <div class="card-right">
      <div class="name">黃靖凱</div>
      <div class="title">大學生</div>
      <div class="info">
        📧 s111415015@stu.ntue.edu.tw<br>
        📱 0912-345-678<br>
        🌐 台北市萬華區
      </div>
    </div>
  </div>
</body>
</html>

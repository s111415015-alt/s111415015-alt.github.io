<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自我介紹 - 黃靖凱個人網站</title>
  <style>
    body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial; background:#f7f7f9; color:#222; }
    .container { max-width:700px; margin:40px auto; background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.03); padding:40px 28px; }
    h1 { font-size:2.2em; font-weight:700; margin-bottom:18px; }
    h2 { font-size:1.3em; margin-top:32px; margin-bottom:12px; color:#0b76ef; }
    p { font-size:1.1em; color:#555; line-height:1.8; }
    .photo-block { display:flex; align-items:flex-start; margin-bottom:28px; }
    .photo-block img { width:150px; height:220px; object-fit:cover; border-radius:18px; border:3px solid #e5e7eb; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-right:32px; }
    .about-content { flex:1; }
    .back-link { margin-top:36px; display:block; text-align:right; }
    a { color:#0b76ef; text-decoration:none; }
    a:hover { text-decoration:underline; }
    @media (max-width:600px) {
      .photo-block { flex-direction:column; align-items:center; }
      .photo-block img { margin-right:0; margin-bottom:18px; width:100px; height:146px; }
      .about-content { width:100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>自我介紹</h1>
    <div class="photo-block">
      <img src="pic1.jpg" alt="個人照片">
      <div class="about-content">
        <h2>關於我</h2>
        <p>哈囉，我是黃靖凱，現在就讀於國立台北教育大學藝術與造型設計學系。</p>
        <h2>興趣</h2>
        <p>繪畫、打排球、追劇。</p>
      </div>
    </div>
    <a class="back-link" href="index.html">← 回首頁</a>
  </div>
</body>
</html>

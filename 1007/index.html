<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>4x5 表格範例</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin: 20px auto; }
        th, td { border: 1px solid #333; padding: 8px 12px; text-align: center; }
    </style>
</head>
<body>
    <h2 style="text-align:center;"></h2>
    <table>
        <tr>
            <th>分類</th><th>縮圖</th><th>標題與描述</th><th>拍攝日期</th>
        </tr>
        <tr>
            <th rowspan="2">城市風景</th>
            <td><img src="pic2.jpg" alt="Italian Trulli"></td>
            <td>河畔夕陽<br>照金色陽光灑在河面，倒映城市天際線。</td>
            <td>2025-09-01</td>
        </tr>
        <tr>
            <td><img src="pic3.jpg" alt="Italian Trulli"></td>
            <td>夜色小徑<br>街角咖啡店透出溫暖光暈。</td>
            <td>2025-09-02</td>
        </tr>
        <tr>
            <th colspan="4">海邊旅行</th>
        </tr>
        <tr>
            <td>自然風景</td>
            <td><img src="pic4.jpg" alt="Italian Trulli"></td>
            <td>清晨海浪<br>第一道陽光照亮浪花與沙粒。</td>
            <td>2025-09-03</td>
        </tr>
    </table>
</body>
</html>
